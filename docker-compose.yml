version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mahjong_postgres
    restart: always
    environment:
      POSTGRES_USER: mahjong_user
      POSTGRES_PASSWORD: mahjong_pass
      POSTGRES_DB: mahjong_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahjong_user -d mahjong_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mahjong_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://mahjong_user:mahjong_pass@db:5432/mahjong_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mahjong_frontend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
